[project]
name = "kaggle-rotate"
version = "0.1.0"
description = "Hot-swapping pool of Kaggle GPU notebooks behind one stable OpenAI-compatible endpoint"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "kaggle>=1.6.17",
]

[project.scripts]
kaggle-rotate = "kaggle_rotate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaggle_rotate"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"